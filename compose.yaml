services:
  rtnote:
    # Builds from this repository until RTNote publishes a container image.
    build: .
    image: "${RTNOTE_IMAGE:-ghcr.io/madlyfx/rtnote}:${RTNOTE_VERSION:-latest}"
    restart: unless-stopped
    init: true
    ports:
      - "${RTNOTE_PORT:-8787}:8787"
    environment:
      RTNOTE_AUTH_USERNAME: "${RTNOTE_AUTH_USERNAME:-admin}"
      RTNOTE_AUTH_PASSWORD: "${RTNOTE_AUTH_PASSWORD:?Set RTNOTE_AUTH_PASSWORD before starting RTNote}"
      RTNOTE_CONTAINER_IMAGE: "${RTNOTE_IMAGE:-ghcr.io/madlyfx/rtnote}"
    volumes:
      - rtnote-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  rtnote-data:
