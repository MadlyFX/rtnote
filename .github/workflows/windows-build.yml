name: Windows build

# Builds an unsigned Windows x64 installer for manual installation. Other
# platforms are added in Phase 1 of the RTNote plan.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: rtnote-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: >-
      github.repository == 'MadlyFX/rtnote' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      EDGE_EVER_DESKTOP_BUILD: '1'
      EDGE_EVER_DESKTOP_ARCH: x64
      EDGE_EVER_DESKTOP_TARGET: win
      EDGE_EVER_DESKTOP_FORK_BUILD: '1'
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            crates\desktop-sidecar\target
          key: rtnote-windows-x64-rust-${{ hashFiles('crates/desktop-sidecar/Cargo.lock', 'crates/desktop-sidecar/**/*.rs') }}
          restore-keys: rtnote-windows-x64-rust-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check types
        run: bun run typecheck
      - name: Test branding and manual update policy
        run: bun test apps/web/src/lib/branding.test.mjs apps/desktop/src/main/desktop-update-policy.test.mjs
      - name: Build renderer
        run: bun run build:web
      - name: Build native sidecar
        run: cargo build --manifest-path crates/desktop-sidecar/Cargo.toml --release
      - name: Package installer
        run: bun scripts/run-desktop-builder.mjs --publish never
      - name: Verify package
        env:
          EDGE_EVER_VERIFY_TARGET: win32
        run: bun scripts/verify-desktop-package.mjs
      - name: Verify manual update isolation
        run: bun scripts/verify-fork-desktop.mjs
      - name: Verify packaged startup
        run: bun run verify:packaged-desktop-startup -- release/desktop/win-unpacked/RTNote.exe
      - name: Record source and checksums
        shell: pwsh
        run: |
          $sourceCommit = git rev-parse HEAD
          "Source commit: $sourceCommit" | Set-Content release/desktop/BUILD.txt
          Get-ChildItem release/desktop -Filter '*-windows-x64.exe' | ForEach-Object {
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Set-Content release/desktop/SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: rtnote-windows-x64-${{ github.run_number }}
          path: |
            release/desktop/*-windows-x64.exe
            release/desktop/SHA256SUMS.txt
            release/desktop/BUILD.txt
          if-no-files-found: error
          retention-days: 30
