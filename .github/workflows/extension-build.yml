name: Web clipper build

# Builds the RTNote web clipper for Chrome/Edge and Firefox. The packages are
# unsigned: load the Chromium zip unpacked in developer mode, and load the
# Firefox package as a temporary add-on until it is signed through Mozilla.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'apps/extension/**'
      - 'packages/shared/**'
      - 'apps/web/src/components/ui/**'
      - 'apps/web/src/lib/utils.ts'
      - 'patches/**'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/publish-web-clipper.mjs'
      - 'scripts/verify-extension-source.mjs'
      - '.github/workflows/extension-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/extension/**'
      - 'packages/shared/**'
      - 'apps/web/src/components/ui/**'
      - 'apps/web/src/lib/utils.ts'
      - 'patches/**'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/publish-web-clipper.mjs'
      - 'scripts/verify-extension-source.mjs'
      - '.github/workflows/extension-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Chromium and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test extension
        run: bun run test:extension
      - name: Build Chromium extension
        run: bun run build:extension
      - name: Build, lint and package Firefox extension
        run: bun run package:extension:firefox
      - name: Rebuild Firefox from the review source archive
        run: bun scripts/verify-extension-source.mjs
      - name: Name packages and record checksums
        run: |
          version="$(node -p "require('./apps/extension/package.json').version")"
          mkdir -p release/extension
          (cd apps/extension/dist && zip -qr "../../../release/extension/rtnote-web-clipper-chromium-v${version}.zip" .)
          firefox_package="$(ls apps/extension/web-ext-artifacts/*.zip | head -1)"
          cp "$firefox_package" "release/extension/rtnote-web-clipper-firefox-v${version}.zip"
          cd release/extension
          sha256sum *.zip > SHA256SUMS-web-clipper.txt
      - uses: actions/upload-artifact@v6
        with:
          name: rtnote-web-clipper
          path: release/extension/*
          if-no-files-found: error
          retention-days: 30
