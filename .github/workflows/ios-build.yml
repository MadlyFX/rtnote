name: iOS build

# Builds the SwiftUI app for the iOS Simulator and runs its unit tests. No
# signing is involved; device and TestFlight builds need an Apple Developer
# account. macOS runners cost 10x minutes on private repositories, so this runs
# only when the iOS app changes, or on demand.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

concurrency:
  group: rtnote-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.repository == 'MadlyFX/rtnote'
    name: Simulator build and unit tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Resolve packages
        working-directory: apps/ios
        run: |
          xcodebuild -project RTNote.xcodeproj -scheme RTNote \
            -resolvePackageDependencies \
            -destination 'generic/platform=iOS Simulator'
      - name: Build
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project RTNote.xcodeproj \
            -scheme RTNote \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Test
        working-directory: apps/ios
        run: |
          DEST="$(
            xcodebuild -project RTNote.xcodeproj -scheme RTNote -showdestinations 2>/dev/null \
              | sed -n 's/.*name:\(iPhone[^,}]*\).*/\1/p' \
              | sed 's/[[:space:]]*$//' \
              | head -1
          )"
          DEST="${DEST:-iPhone 16}"
          echo "Using simulator: $DEST"
          xcodebuild test \
            -project RTNote.xcodeproj \
            -scheme RTNote \
            -destination "platform=iOS Simulator,name=$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:RTNoteTests
