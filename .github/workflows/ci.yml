name: CI

# Runs lint, type checks, the web build and the non-E2E regression suite for
# every pull request and every push to main.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtnote-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            if [[ "$attempt" = "3" ]]; then
              exit 1
            fi
            sleep "$((15 * attempt))"
          done

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Type check mobile
        run: bun run typecheck:mobile

      - name: Build web
        run: bun run build:web

  tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            if [[ "$attempt" = "3" ]]; then
              exit 1
            fi
            sleep "$((15 * attempt))"
          done

      - name: Run regression tests
        run: bun run test
