name: Android build

# Builds the release-signed RTNote Android APK (arm64-v8a) on a GitHub-hosted
# runner. The Release workflow calls this workflow for tagged releases.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'patches/**'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/build-android-local.sh'
      - 'scripts/verify-android-apk-signature.mjs'
      - 'scripts/prepare-mobile-icons.mjs'
      - '.github/workflows/android-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'patches/**'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/build-android-local.sh'
      - 'scripts/verify-android-apk-signature.mjs'
      - 'scripts/prepare-mobile-icons.mjs'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: rtnote-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  apk:
    # Signing secrets exist only in this repository, not in forks.
    if: >-
      github.repository == 'MadlyFX/rtnote' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "build-tools;36.0.0" "platforms;android-36" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: rtnote-android-gradle-${{ hashFiles('bun.lock', 'apps/mobile/app.json') }}
          restore-keys: rtnote-android-gradle-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck:mobile
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/rtnote-release.p12"
      - name: Build release-signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/rtnote-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EDGE_EVER_ANDROID_APK_ARCHS: arm64-v8a
          # Metro's release bundle exceeds Node's default ~2 GB heap.
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build:android:apk
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/rtnote-release.p12"
      - name: Name APK and record checksum
        run: |
          version="$(node -p "require('./apps/mobile/app.json').expo.version")"
          mkdir -p release/android
          name="rtnote-android-v${version}-arm64-v8a.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "release/android/$name"
          cd release/android
          sha256sum "$name" > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v6
        with:
          name: rtnote-android-arm64
          path: release/android/*
          if-no-files-found: error
          retention-days: 30
